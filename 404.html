<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#263a32">
<title>Page not found | LMAC Customs</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f5f3ee;--green:#263a32;--ink:#292b29;--muted:#5c5f58;--bronze:#9d8060;--serif:'Italiana',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--ivory);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.top{padding:28px clamp(22px,6vw,94px)}
.top img{display:block;width:150px;height:auto}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px clamp(22px,6vw,94px) 64px}
.dog{display:block;width:clamp(270px,44vw,480px);height:auto;margin:0 auto 6px}
.eyebrow{display:inline-flex;align-items:center;gap:14px;margin:0 0 16px;color:var(--bronze);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.eyebrow:before{content:"";width:30px;border-top:1px solid var(--bronze)}
h1{margin:0 0 18px;font:400 clamp(46px,8vw,86px)/1.1 var(--serif);letter-spacing:-.015em;color:var(--ink)}
h1 em{color:#c9b48f}
p{max-width:480px;margin:0 auto 32px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border:1px solid var(--green);background:var(--green);color:#fff;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:background .2s,color .2s}
.button:hover{background:#354c40}
.button.outline{background:transparent;color:var(--green)}
.button.outline:hover{background:var(--green);color:#fff}
.button:focus-visible{outline:2px solid var(--bronze);outline-offset:3px}
footer{padding:22px clamp(22px,6vw,94px);border-top:1px solid #263a3220;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--green);text-decoration:none;border-bottom:1px solid var(--bronze)}
</style>
</head>
<body>
<header class="top"><a href="/" aria-label="LMAC Customs home"><img src="/logo.svg" width="900" height="330" alt="LMAC Customs"></a></header>
<main>
<img class="dog" src="/magnus.webp" width="1400" height="971" alt="Watercolor and ink illustration of Magnus, a spotted dog in a blue harness, happily carrying a long stick">
<p class="eyebrow">Page not found</p>
<h1>This page <em>wandered off.</em></h1>
<p>Magnus went looking for it and came back with a stick. In the meantime, let's get you back to the work that matters.</p>
<div class="actions"><a class="button" href="/">Back to home</a><a class="button outline" href="/#contact">Start a project</a></div>
</main>
<footer>Looking for something specific? <a href="tel:+12075837516">(207) 583-7516</a> · <a href="mailto:brandon@lmaccustoms.com">brandon@lmaccustoms.com</a></footer>
</body>
</html>
